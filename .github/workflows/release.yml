name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Verify tag and package version
        run: node --input-type=module -e "import fs from 'node:fs'; const p=JSON.parse(fs.readFileSync('package.json')); if(process.env.GITHUB_REF_NAME !== 'v'+p.version) throw new Error('Tag and package version must match');"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code -- src/index.d.ts package-lock.json
      - run: npm run release
      - name: Publish versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "release/doggy-avatar-generator-${RELEASE_TAG#v}.tgz" \
            release/doggy-avatar-generator.mjs \
            release/doggy-avatar-generator.d.mts \
            release/SHA256SUMS \
            --verify-tag --latest \
            --title "Doggy Avatar Generator $RELEASE_TAG" \
            --notes-file release/RELEASE_NOTES.md
